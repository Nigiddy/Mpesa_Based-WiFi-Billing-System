# Nginx alternative reverse proxy — Qonnect WiFi (Vercel + VPS Split-Domain)
#
# Architecture:
#   Vercel CDN  →  https://portal.yourdomain.com   (Next.js frontend, NOT served here)
#   This VPS   →  https://api.yourdomain.com       (Node backend, Docker :5000)
#
# TLS cert via Certbot:
#   certbot --nginx -d api.yourdomain.com
#
# Replace every occurrence of `yourdomain.com` with your real domain.
#
# Prefer Caddy (Caddyfile) for automatic certificate renewal.
# Use this file only if Nginx is already installed on the VPS.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.yourdomain.com;

    # Allow Certbot ACME challenge through before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — API backend ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # Modern TLS — TLS 1.2 + 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS — enable only after TLS is confirmed working end-to-end
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Common proxy headers (applies to all locations) ───────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── REST + captive-portal routes ──────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket upgrade support (admin dashboard real-time updates on /ws*)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        # Buffer tuning for M-Pesa callback payloads
        proxy_buffer_size        16k;
        proxy_buffers            8 16k;
        proxy_busy_buffers_size  32k;
    }

    access_log /var/log/nginx/api-access.log;
    error_log  /var/log/nginx/api-error.log warn;
}

# ── WebSocket upgrade map (place in http {} context in nginx.conf if using
#    an include-based setup; harmless here as a reminder) ─────────────────────
# map $http_upgrade $connection_upgrade {
#     default   upgrade;
#     ''        close;
# }
#
# If you use a single nginx.conf file (not includes), add the map block above
# to the http { } section and remove the comment markers.
