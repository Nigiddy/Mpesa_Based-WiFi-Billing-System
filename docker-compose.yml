services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kibaruani-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      # Expose to localhost on VPS for host reverse proxy (Caddy / Nginx)
      - "127.0.0.1:5000:5000"
    volumes:
      # Persistent audit and error logs
      - ./logs:/app/logs
    networks:
      - kibaruani-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: mysql:8.0
    container_name: kibaruani-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: wifi_billing
      MYSQL_USER: kibaruani
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kibaruani-network
    # Security: Database is NOT exposed to public host ports
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: kibaruani-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - kibaruani-network
    # Security: Redis is NOT exposed to public host ports
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  kibaruani-network:
    name: kibaruani-network
    driver: bridge

volumes:
  mysql_data:
    name: kibaruani_mysql_data
  redis_data:
    name: kibaruani_redis_data
